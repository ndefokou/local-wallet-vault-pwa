[package]
name = "local-wallet-vault-core"
version = "0.1.0"
edition = "2021"
description = "Core cryptographic and business logic for Local Wallet Vault PWA"
authors = ["Local Wallet Vault Team"]
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# WASM bindings
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

# Crypto
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"

# Random generation
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }

# Utilities
base64 = "0.22"
thiserror = "1.0"

# WASM utilities
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = ["console_error_panic_hook"]

[profile.release]
opt-level = "s"
lto = true