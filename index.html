<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Primary Meta Tags -->
    <title>Local Wallet Vault</title>
    <meta name="title" content="Local Wallet Vault" />
    <meta name="description" content="A local encrypted wallet vault PWA using WebAuthn PRF and OPFS. Store your wallet information securely on your device." />
    <meta name="author" content="Local Wallet Vault" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1e293b" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wallet Vault" />
    <meta name="application-name" content="Wallet Vault" />
    <meta name="msapplication-TileColor" content="#1e293b" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Note: VitePWA automatically injects the manifest link -->
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/" />
    <meta property="og:title" content="Local Wallet Vault" />
    <meta property="og:description" content="A local encrypted wallet vault PWA using WebAuthn PRF and OPFS. Store your wallet information securely on your device." />
    <meta property="og:image" content="/icons/icon-512x512.png" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="/" />
    <meta property="twitter:title" content="Local Wallet Vault" />
    <meta property="twitter:description" content="A local encrypted wallet vault PWA using WebAuthn PRF and OPFS. Store your wallet information securely on your device." />
    <meta property="twitter:image" content="/icons/icon-512x512.png" />
    
    <!-- Security Headers (additional, should be set by server too) -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    
    <!-- Preconnect to improve performance -->
    <link rel="preconnect" href="/" />
    
    <!-- Splash screens for iOS PWA -->
    <style>
      /* Prevent flash of unstyled content */
      html { background-color: #0f172a; }
      body {
        background-color: #0f172a;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Fallback for no JavaScript -->
    <noscript>
      <div style="padding: 20px; text-align: center; font-family: system-ui, sans-serif;">
        <h1>JavaScript Required</h1>
        <p>Local Wallet Vault requires JavaScript to function. Please enable JavaScript in your browser settings.</p>
      </div>
    </noscript>
  </body>
</html>
